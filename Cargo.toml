[package]
name = "monitor-agent"
version = "1.2.0"
edition = "2021"
license = "MIT"
description = "Linux monitoring agent for the monitor hub"
repository = "https://github.com/carsonmoon/jspanel-agent"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# A single-threaded runtime suffices: one report every few seconds plus a
# handful of TCP probes.
tokio = { version = "1", features = ["rt", "macros", "net", "time", "sync", "io-util", "process", "fs"] }
rustix = { version = "1", features = ["fs"] }
# 回程线路探测（四期）：raw ICMP traceroute 需要 socket/setsockopt 系统调用
libc = "0.2"
tokio-tungstenite = { version = "0.28", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }
# tokio-tungstenite 0.28 leaves the crypto provider to the caller: rustls
# selects one automatically only when exactly one provider feature is enabled.
# Without this the agent panics on its first wss:// connection.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
futures-util = { version = "0.3", default-features = false, features = ["sink"] }
if-addrs = "0.15.0"
# socks：net.http_probe 支持经 socks5 出口链拨号（协议出口诊断，全链真实延迟）。
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "socks"] }
# 用户级流量统计（M7）轮询 sing-box 的 v2ray stats：一个 gRPC 方法，直接
# 驱动 h2 而不是引入整套 tonic。
h2 = "0.4"
http = "1"
tar = "0.4.46"
flate2 = "1.1.10"
sha2 = "0.11.0"
rand = "0.9"

[dev-dependencies]
# Only the tests need a movable clock; the write-deadline arithmetic spans
# minutes. dev-dependencies do not reach the shipped binary.
tokio = { version = "1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "z"
panic = "abort"
strip = true

[lints.clippy]
# 锁不可跨 await：与 hub 同款（冻结复盘三道防线之一），agent 仓清完
# lint 债（2026-10-27）后接入，此后机械拦截不再依赖人记。
await_holding_lock = "deny"
